[project]
name = "precedent"
version = "0.1.0"
description = "An agentic memory layer for open source maintainers, built on CockroachDB."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Kept separate so the ingest can run before the data layer is decided.
db = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
aws = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precedent"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
