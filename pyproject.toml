[project]
name = "precedent"
version = "0.1.0"
description = "An agentic memory layer for open source maintainers, built on CockroachDB."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # Exact token counting. Character-based truncation is not a workable
    # substitute against an 8192 token hard limit on a corpus full of code.
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
# Kept separate so the ingest can run before the data layer is decided.
db = [
    "sqlalchemy[asyncio]>=2.1.1",
    "sqlalchemy-cockroachdb>=2.0.4",
    "asyncpg>=0.31.0",
]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]
aws = [
    "boto3>=1.43.103",
]
# Acting on a pull request, as opposed to being taught by one. GitHub App
# authentication is RS256, so the signing libraries come with it. Kept separate
# because listening needs none of this: the webhook secret alone is enough to
# verify a delivery, and a deployment that only listens should not carry a
# compiled crypto wheel to do it.
github = [
    "pyjwt>=2.15.0",
    "cryptography>=50.0.1",
]
# Lambda runs the same ASGI app; Mangum is the only thing it needs that the
# local server does not. Kept out of `api` so `uvicorn` and `mangum` are never
# both dragged into a deployment that only wants one of them.
lambda = [
    "mangum>=0.22.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "pyyaml>=6.0.3",
    "mypy>=2.3.1",
    # Without these, `transform/maintainers.py` is unanalysable.
    "types-PyYAML>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precedent"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Not --strict. Strict reports 97, nearly all missing annotations on internal
# helpers, and a check nobody reaches zero on is a check that gets ignored.
# Defaults found four real bugs. Tighten one flag at a time, from zero.
[tool.mypy]
python_version = "3.11"
files = ["src/precedent"]
# 28 of the 44 findings are in app.py, nearly all from `Deps` typing its fields
# `object`. Fixing it means typing that container and touching every route in
# the module that serves the live demo, which is also the least test-covered
# one here. Worth doing deliberately rather than for an error count.
exclude = "src/precedent/api/app\\.py"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# No py.typed marker. Only the migration driver imports it.
module = ["asyncpg.*"]
ignore_missing_imports = true
