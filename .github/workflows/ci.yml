name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the project claims to support; 3.12 is what the
        # Lambda package targets. Both are load-bearing, so both are tested.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # setup-python, not just setup-uv. The runner's own Python lives in /usr
      # and is externally managed, so `uv pip install --system` refuses it under
      # PEP 668. This also makes the matrix real: without it every job used the
      # runner default, so the 3.11 entry was testing 3.12 and passing.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Every extra, including `github`. The extras exist so a deployment can
      # carry only what it uses; CI is the one place that has to install all of
      # them, because the test suite covers all of them.
      - name: Install
        run: uv pip install --system -e ".[db,api,aws,lambda,github,dev]"

      - name: Confirm the interpreter is the one the matrix asked for
        run: python -c "import sys; print(sys.version); assert sys.version.startswith('${{ matrix.python-version }}')"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      # The tests never touch a cluster, so an import error in a database or
      # deployment module would pass CI and fail only on deploy. Importing every
      # module catches that without needing credentials.
      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import precedent

          failed = []
          for module in pkgutil.walk_packages(precedent.__path__, "precedent."):
              try:
                  importlib.import_module(module.name)
              except Exception as exc:
                  failed.append(f"{module.name}: {type(exc).__name__}: {exc}")

          for line in failed:
              print(line)
          sys.exit(1 if failed else 0)
          PY

  package:
    # Proves the deployment artefact still builds and stays inside Lambda's
    # limits. It caught nothing yet; it exists so that a dependency growing past
    # 250 MB is found here rather than during an upload the night before a
    # deadline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Lambda runtime the package targets.
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system -e ".[db,api,lambda]"
      - run: python scripts/build_lambda.py
      - name: Check the package contents
        run: |
          python - <<'PY'
          import zipfile

          names = zipfile.ZipFile("build/precedent-lambda.zip").namelist()
          binaries = [n for n in names if n.endswith((".so", ".pyd"))]
          windows = [n for n in binaries if n.endswith(".pyd")]

          assert "precedent/api/lambda_handler.py" in names, "handler missing"
          assert "precedent/api/static/index.html" in names, "page missing"
          assert any(n.startswith("asyncpg/") for n in names), "asyncpg missing"
          # Read at runtime, not imported, so nothing else here would notice it
          # was absent. Without it the maintainer list is empty in deployment
          # and authorship checks silently fall back to authorAssociation.
          assert "config/maintainers.yaml" in names, "maintainer list missing"
          assert not windows, f"windows binaries in a linux package: {windows}"
          print(f"{len(names)} files, {len(binaries)} compiled extensions, none for windows")
          PY

      # Actually import the built artefact, rather than checking that files with
      # the right names are present in it.
      #
      # A deployment failed on `No module named 'yaml'` that every other check
      # here passed: the tests import from the source tree with the dev extras
      # installed, so a dependency missing from the *package* is invisible to
      # them. This runner is Linux on the same Python the package targets, so
      # importing out of the unzipped directory is the same import Lambda does.
      - name: Import the handler out of the package, as Lambda does
        run: |
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          unzip -q build/precedent-lambda.zip -d /tmp/pkg
          cd /tmp/pkg
          python -c "
          import precedent.api.lambda_handler as h
          from precedent.transform.maintainers import find_maintainer_list, load_maintainers
          print('handler:', h.handler)
          found = find_maintainer_list()
          assert found.is_file(), f'maintainer list not found from the package layout: {found}'
          logins = load_maintainers('pandas-dev/pandas')
          assert logins, 'maintainer list loaded but empty'
          print(f'maintainers: {len(logins)} from {found}')
          "
