name: Idea
description: Something it should do, or should stop doing.
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Two things this deliberately does not do, before you write it up. It
        does not replace linters: deterministic rules belong in `ruff`, `mypy`
        and CI, and this is for the conventions that only exist in people's
        heads. And it does not fall back on the base model when memory is
        empty, because refusing is the feature.

  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: >
        The situation it would improve, rather than the feature itself. A
        maintainer or contributor hitting something, ideally.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind

  - type: textarea
    id: measure
    attributes:
      label: How would we know it worked
      description: >
        Optional, and genuinely useful. Most of this project's mistakes were
        things that looked fine and were not, so anything that ships tends to
        need a number attached before and after.
