<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="How a rule changes: review comments become a rule, a rule becomes a cited answer, and a maintainer correction either retires the rule and replaces it or becomes further evidence for it.">
  <style>
    .bg    { fill: #ffffff; }
    .card  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .t     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .title { font-size: 21px; font-weight: 600; }
    .sub   { font-size: 13px; fill: #656d76; }
    .lane  { font-size: 11px; font-weight: 600; letter-spacing: 1.1px; }
    .name  { font-size: 13px; font-weight: 600; }
    .meta  { font-size: 11px; fill: #656d76; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; marker-end: url(#b); }
    .dash  { stroke: #8c959f; stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; marker-end: url(#b); }
    .note  { font-size: 11px; fill: #656d76; font-style: italic; }
    .edge  { font-size: 11px; font-weight: 600; fill: #656d76; }
  </style>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="660"/>

  <text class="t title" x="40" y="44">What a correction does</text>
  <text class="t sub"   x="40" y="66">Nothing is deleted. A retired rule keeps its evidence and the reason it was replaced.</text>

  <!-- ===== row 1: how a rule becomes an answer ===== -->
  <rect class="card" x="40" y="104" width="190" height="62" rx="6"/>
  <text class="t name" x="135" y="128" text-anchor="middle">review comments</text>
  <text class="t meta" x="135" y="146" text-anchor="middle">clustered by topic</text>

  <rect x="290" y="104" width="220" height="62" rx="6" fill="#ffffff" stroke="#6933FF" stroke-width="1.8"/>
  <text class="t name" x="400" y="128" text-anchor="middle">a rule</text>
  <text class="mono" x="400" y="146" font-size="10.5" text-anchor="middle" fill="#656d76">origin=extracted · conf 0.72</text>

  <rect class="card" x="570" y="104" width="220" height="62" rx="6"/>
  <text class="t name" x="680" y="128" text-anchor="middle">an answer</text>
  <text class="mono" x="680" y="146" font-size="10.5" text-anchor="middle" fill="#656d76">cites PR #65052</text>

  <path class="arrow" d="M230,135 L286,135"/>
  <path class="arrow" d="M510,135 L566,135"/>

  <text class="t note" x="850" y="130">the answer records</text>
  <text class="t note" x="850" y="145">which rule it used</text>
  <path class="dash" d="M846,138 L794,138"/>

  <!-- ===== the correction arrives ===== -->
  <path class="arrow" d="M680,166 L680,222"/>
  <rect class="card" x="700" y="172" width="256" height="40" rx="4"/>
  <text class="t meta" x="712" y="189" font-size="9.5">a maintainer, on the pull request</text>
  <text class="mono" x="712" y="205" font-size="10.5">@precedent actually, not at the top</text>

  <!-- ===== the judge ===== -->
  <rect x="270" y="224" width="460" height="74" rx="8" fill="#fff8f0" stroke="#FF9900" stroke-width="1.8"/>
  <text class="t name" x="500" y="252" text-anchor="middle">a model decides whether this contradicts</text>
  <text class="t name" x="500" y="270" text-anchor="middle">the rule the answer actually used</text>
  <text class="t meta" x="500" y="288" text-anchor="middle">not a distance threshold: embeddings put opposites close together</text>

  <path class="arrow" d="M390,298 L270,344"/>
  <text class="t edge" x="286" y="326" fill="#cf222e">contradicts</text>

  <path class="arrow" d="M610,298 L730,344"/>
  <text class="t edge" x="652" y="326" fill="#1a7f37">agrees</text>

  <!-- ===== left branch: contradiction ===== -->
  <rect x="40" y="348" width="440" height="156" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="t lane" x="58" y="372" fill="#cf222e">RETIRE AND REPLACE</text>

  <rect class="card" x="58" y="386" width="178" height="98" rx="6"/>
  <text class="t name" x="147" y="410" text-anchor="middle" fill="#656d76">the old rule</text>
  <rect x="100" y="420" width="94" height="19" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="0.8"/>
  <text class="mono" x="147" y="433" font-size="10" text-anchor="middle" fill="#cf222e">retired</text>
  <text class="t meta" x="147" y="455" text-anchor="middle">evidence and reason kept,</text>
  <text class="t meta" x="147" y="470" text-anchor="middle">superseded_by set</text>

  <rect x="284" y="386" width="178" height="98" rx="6" fill="#ffffff" stroke="#6933FF" stroke-width="1.8"/>
  <text class="t name" x="373" y="410" text-anchor="middle">the replacement</text>
  <rect x="314" y="420" width="118" height="19" rx="9" fill="#f3efff" stroke="#6933FF" stroke-width="0.8"/>
  <text class="mono" x="373" y="433" font-size="10" text-anchor="middle" fill="#6933FF">origin=correction</text>
  <text class="t meta" x="373" y="455" text-anchor="middle">confidence floor 0.85,</text>
  <text class="t meta" x="373" y="470" text-anchor="middle">above the rule it replaced</text>

  <path class="dash" d="M236,428 L280,428"/>

  <!-- ===== right branch: agreement ===== -->
  <rect x="520" y="348" width="440" height="156" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="t lane" x="538" y="372" fill="#1a7f37">STRENGTHEN</text>

  <rect x="538" y="386" width="404" height="98" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
  <text class="t name" x="740" y="414" text-anchor="middle">the same rule, one more piece of evidence</text>
  <text class="t meta" x="740" y="437" text-anchor="middle">The rule was right and the answer misused it, so the correction</text>
  <text class="t meta" x="740" y="453" text-anchor="middle">becomes evidence for it rather than a second copy of it.</text>
  <text class="t meta" x="740" y="472" text-anchor="middle">Confidence rises. Nothing is retired.</text>

  <!-- ===== converge ===== -->
  <path class="arrow" d="M260,504 L260,538 L390,538 L390,562"/>
  <path class="arrow" d="M740,504 L740,538 L610,538 L610,562"/>

  <rect x="340" y="564" width="320" height="52" rx="6" fill="#f3efff" stroke="#6933FF" stroke-width="1.8"/>
  <text class="t name" x="500" y="586" text-anchor="middle">the next answer cites the correction</text>
  <text class="t meta" x="500" y="604" text-anchor="middle">on the same retrieval path as any pull request</text>

  <text class="t note" x="40" y="646">A correction is stored as a review comment of kind maintainer_correction, so it is embedded, retrieved and cited like anything said on a real pull request.</text>
</svg>
